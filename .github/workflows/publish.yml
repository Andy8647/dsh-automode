name: publish

# Publish dsh-automode to npm. Trigger: manual dispatch, or a push of a `v*` tag.
#
# Requires the repository secret `NPM_TOKEN` — a granular npm access token with
# publish rights for this package name, "Bypass 2FA" enabled (CI cannot answer
# an OTP prompt). Generate at https://www.npmjs.com/settings/<user>/tokens.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
