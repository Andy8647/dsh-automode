# The dsh-auto-approval bundle patch: mount the auto-approval classifier as
# one row in the composition. Later layers (the profile's own
# cordis.patch.yml, or the `auto-approval:` section in
# $DSH_HOME/settings.yaml) address this row by id to replace its config.
# With no override, the plugin's schemastery schema defaults apply
# (L0 rules only; L1 stays off until classifierFastProvider/Model are set).
- insert:
    - id: auto-approval
      name: '@deepseek-ai/dsh-auto-approval'
    - id: ui-auto-approval
      name: '@deepseek-ai/dsh-client-ui-auto-approval'
